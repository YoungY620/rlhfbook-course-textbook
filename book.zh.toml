[book]
title = "基于人类反馈的强化学习——课程教材"
authors = ["Nathan Lambert"]
description = "RLHF 一书的课程教材伴侣：信息密集、中英双语、可交互。"
language = "zh"
src = "src/zh"

[build]
build-dir = "book/zh"
create-missing = false

[output.html]
theme = "theme"
default-theme = "light"
preferred-dark-theme = "navy"
mathjax-support = false
additional-css = ["theme/ta-widget.css"]
additional-js = ["theme/ta-widget.js"]
git-repository-url = "https://github.com/YoungY620/rlhfbook-course-textbook"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1

[output.html.fold]
enable = false
level = 0

[output.html.print]
enable = true

[output.html.playground]
editable = false
