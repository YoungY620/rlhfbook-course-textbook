[book]
title = "Reinforcement Learning from Human Feedback — Course Textbook"
authors = ["Nathan Lambert"]
description = "A course-textbook companion to the RLHF book: dense, bilingual, and interactive."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
theme = "theme"
default-theme = "light"
preferred-dark-theme = "navy"
mathjax-support = false
additional-css = ["theme/ta-widget.css"]
additional-js = ["theme/ta-widget.js"]
git-repository-url = "https://github.com/YoungY620/rlhfbook-course-textbook"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1

[output.html.fold]
enable = false
level = 0

[output.html.print]
enable = true

[output.html.playground]
editable = false
